name: Daily PDFs
on:
  schedule:
    # UTC, away from the congested start of the hour. 06:23 UK winter / 07:23 summer.
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Refresh all posts regardless of schedule"
        default: false
        type: boolean
      smoke_only:
        description: "Check source fetching and the catalogue without making PDFs"
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: daily-pdf-archive
  cancel-in-progress: false
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAGES_PUBLISH_ENABLED: ${{ secrets.PAGES_DEPLOY_KEY != '' || secrets.PAGES_PUBLISH_TOKEN != '' }}
      PAGES_PUBLIC_DOWNLOADS: ${{ vars.PAGES_PUBLIC_DOWNLOADS || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.18"
          python-version: "3.12"
      - uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5
        if: ${{ inputs.smoke_only != true }}
        with:
          typst-version: "0.15.1"
      - name: Install PDF inspection tools
        if: ${{ inputs.smoke_only != true }}
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ty check
      - name: Check converter tests
        if: ${{ inputs.smoke_only != true }}
        run: uv run pytest
      - name: Check runner source access without converting PDFs
        if: ${{ inputs.smoke_only == true }}
        run: uv run --frozen --no-sync python scripts/action-smoke.py
      - name: Convert due posts
        id: batch
        if: ${{ inputs.smoke_only != true }}
        env:
          FORCE: ${{ inputs.force || 'false' }}
        shell: bash
        run: bash scripts/daily-batch.sh
      - name: Preserve PDFs, state and timestamped reports even after partial failure
        id: preserve
        if: ${{ always() && (steps.batch.outcome == 'success' || steps.batch.outcome == 'failure') }}
        shell: bash
        run: |
          if [[ ! -d archive ]]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- archive docs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update PDFs $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Preserve concurrent source changes. A real content conflict fails visibly.
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
      - name: Check out catalogue hosting repository
        id: pages
        if: ${{ always() && steps.preserve.outcome == 'success' && env.PAGES_PUBLISH_ENABLED == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: clvnkhr/clvnkhr.github.io
          ref: master
          path: .cache/pages
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
          token: ${{ secrets.PAGES_PUBLISH_TOKEN || github.token }}
      - name: Publish updated catalogue
        if: ${{ always() && steps.pages.outcome == 'success' }}
        run: |
          git -C .cache/pages config user.name "github-actions[bot]"
          git -C .cache/pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publish_args=(.cache/pages)
          if [[ "$PAGES_PUBLIC_DOWNLOADS" == "true" ]]; then
            publish_args+=(--public-downloads)
          fi
          bash scripts/publish-catalogue.sh "${publish_args[@]}"
