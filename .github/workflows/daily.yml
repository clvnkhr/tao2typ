name: Daily PDFs
on:
  schedule:
    # UTC, away from the congested start of the hour. 06:23 UK winter / 07:23 summer.
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      max_posts:
        description: "Maximum due posts this run (0 = all)"
        default: "25"
        type: string
      force:
        description: "Refresh all posts regardless of schedule"
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: daily-pdf-archive
  cancel-in-progress: false
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.18"
          python-version: "3.12"
      - uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5
        with:
          typst-version: "0.15.1"
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ty check && uv run pytest
      - name: Convert due posts
        id: batch
        env:
          MAX_POSTS: ${{ inputs.max_posts || '25' }}
          FORCE: ${{ inputs.force || 'false' }}
        shell: bash
        run: |
          args=(batch --output archive --max-posts "$MAX_POSTS" --max-seconds 600)
          if [[ "$FORCE" == "true" ]]; then args+=(--force); fi
          uv run tao2typ "${args[@]}"
      - name: Preserve PDFs, state and timestamped reports even after partial failure
        if: ${{ always() && steps.batch.outcome != 'skipped' }}
        shell: bash
        run: |
          if [[ ! -d archive ]]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- archive
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update PDFs $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Preserve concurrent source changes. A real content conflict fails visibly.
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
