[project]
name = "tao2typ"
version = "0.1.0"
description = "Terence Tao's WordPress blog through a structured intermediate representation to Typst and PDF"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Calvin Khor"}]
dependencies = ["beautifulsoup4>=4.14,<5", "httpx>=0.28,<1"]

[project.scripts]
tao2typ = "tao2typ.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1", "ty>=0.0.1,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.12"
